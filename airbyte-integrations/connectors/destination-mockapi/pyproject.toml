[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "destination-mockapi"
version = "0.1.0"
description = "MockAPI destination connector for Airbyte"
authors = ["Airbyte <contact@airbyte.io>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "destination_mockapi" },
]

[tool.poetry.dependencies]
python = "^3.10,<3.12"
airbyte-cdk = "^4.6.2"
requests = "^2.28.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-mock = "^3.10.0"
requests-mock = "^1.10.0"

[tool.poetry.scripts]
destination-mockapi = "destination_mockapi.run:run"

[tool.pytest.ini_options]
testpaths = ["unit_tests", "integration_tests"]
addopts = "-v"